section: unit
title: Code units
order: 10
doc: |
  Code-unit anchoring in CGS (phys::unit_t, src/utilities/phys/unit.h).
  Quantities suffixed _cgs elsewhere are physical; everything else is in
  code units set here. Either density or mass anchors the third unit;
  if mass is present it wins, otherwise density is used (default 1).
  NB: the dynamics EoS stores the derived units in float32 -- make sure
  rho0*l0^3 and rho0*(l0/t0)^2 stay within ~3.4e38 (cross-checked by
  the validator, which mirrors the trunk "Unit sys overflow" throw and
  warns when any code-unit value is within 3 orders of magnitude of
  the float32 dynamic-range edge).
keys:
  length:  { type: float, default: 1, doc: cm per code length unit }
  time:    { type: float, default: 1, doc: s per code time unit }
  density: { type: any,
             doc: g/cm^3 per code density unit, or "mp"/"mh" (ignored if mass is set) }
  mass:    { type: float,
             doc: g per code mass unit (alternative to density; wins if both present) }
