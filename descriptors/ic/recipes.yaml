# IC primitives as expression recipes (M1 里程碑的 "6–8 个命名 IC 原语").
#
# Each recipe inserts one or more [ic.<name>] sections (plus optional
# supporting keys) into a Spec.  They are pure data: the universal pgen
# evaluates the same expressions, so a recipe is guaranteed to mean the
# same thing in the UI, in the preview, and on the GPU.  Numeric defaults
# mirror usr_ext/std_tst where a native test exists.
#
# Expression capabilities used here (see descriptors/expr_grammar.yaml):
# word operators (geq/and/...), tanh & friends, rand(i,j,k,seed).
#
# Conventions:
#   * masks never contain '=' (par-file constraint) — use word ops;
#   * `requires` lists module types the recipe needs (hydro vs mhd);
#   * `notes` record physics caveats (e.g. div-B, gravity).

recipes:
- name: uniform
  title: Uniform medium
  requires: [hydro]
  doc: >
    Single uniform state from [init] rho0/pre0/vel0; adds no ic
    sections (the universal module falls back to the stock uniform
    init when no [ic.*] exists).
  sections: {}

- name: sod
  title: Sod shock tube (hydro)
  requires: [hydro]
  doc: >
    Classic Sod problem on [0,1]^3 (interface at x = 0.5, cell-face
    aligned).  Canonical state rho/p = (1, 1) | (0.125, 0.1);
    exact plateau values p* = 0.30313, rho*_L = 0.42632,
    rho*_R = 0.26557, v* = 0.92745 at t = 0.2.
  sections:
    ic.left:
      mask: x < 0.5
      rho: 1.0
      pre: 1.0
    ic.right:
      mask: x geq 0.5
      rho: 0.125
      pre: 0.1

- name: briowu
  title: Brio-Wu MHD shock tube
  requires: [mhd]
  doc: >
    MHD Sod analogue (usr_ext/std_tst/mhd_st defaults).  The normal
    component b_x is continuous (1.0) so the discrete IC is div-B
    free; interfaces must stay cell-face aligned.
  sections:
    ic.left:
      mask: x < 0.5
      rho: 1.0
      pre: 1.0
      b_x: 1.0
      b_y: 1.0
      b_z: 0.0
    ic.right:
      mask: x geq 0.5
      rho: 0.125
      pre: 0.1
      b_x: 1.0
      b_y: -1.0
      b_z: 0.0

- name: kh
  title: Kelvin-Helmholtz shear layer
  requires: [hydro]
  doc: >
    tanh shear profile on [-0.5,0.5]^2 (usr_ext/std_tst/kh defaults:
    rho0=1, drho=0.5, v0x=0.5, v0y=0.01, l=0.01, sig=0.1, y0=0.25,
    kx=4, pre0=2.5).  A cosine mode plus rand() white noise seed the
    instability; periodic boundaries in x.
  sections:
    ic.layer:
      mask: "1"
      rho: 1 - 0.5*tanh((abs(y)-0.25)/0.01)
      pre: 2.5
      vel_x: 0.5*tanh((abs(y)-0.25)/0.01)
      vel_y: 0.01*cos(4*pi*x)*exp(-((abs(y)-0.25)/0.1)^2) + 0.005*(2*rand(i,j,k,42)-1)

- name: blast
  title: Point overpressure (Sedov-like)
  requires: [hydro]
  doc: >
    Ambient (rho0, pre0) from [init] with a small hot ball of radius
    r0 at the origin.  step() gives a crisp cell-face-free ball;
    refine_region can resolve the center.
  sections:
    ic.blast:
      mask: "1"
      pre: 0.1 + 100*step(0.05 - sqrt(x^2+y^2+z^2))

- name: linear_wave
  title: Linear acoustic wave
  requires: [hydro]
  doc: >
    Small-amplitude traveling sound wave along x for convergence
    tests (usr_ext/std_tst/lw).  gamma from [dynamics]; amp should
    stay << 1.
  sections:
    ic.wave:
      mask: "1"
      rho: 1 + 1e-4*cos(2*pi*x)
      pre: 1/1.4 + 1e-4*cos(2*pi*x)
      vel_x: 1e-4*cos(2*pi*x)

- name: white_noise
  title: White-noise perturbation layer
  requires: [hydro]
  doc: >
    Standalone perturbation snippet (IC 通道 3): layer AFTER any base
    region to add deterministic grid-scale noise.  Deterministic per
    cell (i,j,k) and seed; amplitude set by the prefactor.
  sections:
    ic.noise:
      mask: "1"
      vel_x: 0.01*(2*rand(i,j,k,42)-1)
      vel_y: 0.01*(2*rand(i,j,k,43)-1)
      vel_z: 0.01*(2*rand(i,j,k,44)-1)
  notes: >
    This OVERWRITES the velocity inside the mask (region semantics are
    overwrite, not add).  For velocity noise on a structured base,
    either fold the noise into the base region's expression (see kh)
    or use IC channel 1 (base_file) with a noisy base.

# Deferred: rt (Rayleigh-Taylor) needs a gravity source slot, which
# the universal pgen does not expose yet (std_tst/rt uses a custom
# integrator with a gz member).  Tracked as future work.
