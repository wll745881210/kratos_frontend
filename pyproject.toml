[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kratos-spec"
version = "0.1.0"
description = "Problem Spec IR and tooling for the kratos graphical frontend"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.20"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
kratos-front = "kratos_spec.cli:main"

[tool.setuptools]
package-dir = { "" = "core", "kratos_server" = "web/server/kratos_server" }
packages = ["kratos_spec", "kratos_spec.vendor", "kratos_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
