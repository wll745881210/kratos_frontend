[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kratos-spec"
version = "0.1.0"
description = "Problem Spec IR and tooling for the kratos graphical frontend"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
kratos-front = "kratos_spec.cli:main"

[tool.setuptools]
package-dir = { "" = "core" }

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
